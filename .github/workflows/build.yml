name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish VirtualScreenViewer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v7
        with:
          name: VirtualScreenViewer
          path: out/VirtualScreenViewer.exe
